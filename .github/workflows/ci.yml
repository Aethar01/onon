name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  pull_request:
    paths-ignore:
      - README.md
  workflow_dispatch:

# A newer push to a pull request makes its older runs pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: pacman -Syu --noconfirm git go pkgconf sdl3 libmupdf gtk3 glslang

      - name: Verify native dependencies
        run: |
          pkg-config --cflags --libs mupdf sdl3
          test -f /usr/include/glslang/Include/glslang_c_interface.h

      # Restored everywhere, saved only from main (whose caches pull requests
      # can read) and only when go.sum, Go or the C libraries have changed.
      # Go does not hash the headers cgo reads, so a package built against
      # an older MuPDF would be reused, and MuPDF refuses to start when its
      # header and library versions differ.
      - name: Locate Go cache
        id: go
        run: |
          echo "GOCACHE=${RUNNER_TEMP}/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=${RUNNER_TEMP}/go-mod" >> "$GITHUB_ENV"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
          echo "native=$(pacman -Q libmupdf sdl3 glslang | tr -s ' \n' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: go-${{ runner.os }}-${{ steps.go.outputs.version }}-${{ steps.go.outputs.native }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ steps.go.outputs.version }}-${{ steps.go.outputs.native }}-

      - name: Test
        run: go test -count=1 ./...

      - name: Check generated documentation
        run: go run ./cmd/builddocs -check

      - name: Build
        run: go build ./...

      - name: Save Go cache
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: brew install sdl3 mupdf glslang spirv-cross go dylibbundler

      # glslang compiles themes' shaders and SPIRV-Cross, linked statically,
      # translates them for Metal.
      - name: Set up environment
        run: |
          MUPDF_PREFIX="$(brew --prefix mupdf)"
          SDL3_PREFIX="$(brew --prefix sdl3)"
          GLSLANG_PREFIX="$(brew --prefix glslang)"
          SPIRV_CROSS_PREFIX="$(brew --prefix spirv-cross)"
          echo "CGO_CFLAGS=-I${MUPDF_PREFIX}/include -I${GLSLANG_PREFIX}/include -I${SPIRV_CROSS_PREFIX}/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L${MUPDF_PREFIX}/lib -L${GLSLANG_PREFIX}/lib -L${SPIRV_CROSS_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=${SDL3_PREFIX}/lib:${MUPDF_PREFIX}/lib:${GLSLANG_PREFIX}/lib:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Verify native dependencies
        run: |
          test -f "$(brew --prefix mupdf)/include/mupdf/fitz.h"
          test -f "$(brew --prefix mupdf)/lib/libmupdf.dylib"
          test -f "$(brew --prefix sdl3)/lib/libSDL3.dylib"
          test -f "$(brew --prefix glslang)/lib/libglslang.dylib"
          test -f "$(brew --prefix spirv-cross)/lib/libspirv-cross-c.a"

      # Restored everywhere, saved only from main (whose caches pull requests
      # can read) and only when go.sum, Go or the C libraries have changed.
      # Go does not hash the headers cgo reads, so a package built against
      # an older MuPDF would be reused, and MuPDF refuses to start when its
      # header and library versions differ.
      - name: Locate Go cache
        id: go
        run: |
          echo "GOCACHE=${RUNNER_TEMP}/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=${RUNNER_TEMP}/go-mod" >> "$GITHUB_ENV"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
          echo "native=$(brew list --versions mupdf sdl3 glslang spirv-cross | tr -s ' \n' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: go-${{ runner.os }}-${{ steps.go.outputs.version }}-${{ steps.go.outputs.native }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ steps.go.outputs.version }}-${{ steps.go.outputs.native }}-

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test self-contained app bundle
        run: |
          app="onon.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Frameworks"
          sed -e "s/@VERSION@/0.0.0/" -e "s/@BUILD@/0/" assets/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          # Without -trimpath, which would recompile every package Build did.
          go build -o "$app/Contents/MacOS/onon" .
          dylibbundler -od -b -x "$app/Contents/MacOS/onon" -d "$app/Contents/Frameworks" -p "@executable_path/../Frameworks"
          cp "$(brew --prefix sdl3)/lib/libSDL3.dylib" "$app/Contents/Frameworks/libSDL3.dylib"
          install_name_tool -id "@executable_path/../Frameworks/libSDL3.dylib" "$app/Contents/Frameworks/libSDL3.dylib"
          codesign --force --sign - "$app/Contents/Frameworks/libSDL3.dylib"
          # SDL is dlopen()ed by bare name, which dyld resolves through the
          # executable's rpaths.
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$app/Contents/MacOS/onon"
          codesign --force --sign - "$app/Contents/MacOS/onon"
          test -f "$app/Contents/Frameworks/libSDL3.dylib"
          if otool -L "$app/Contents/MacOS/onon" "$app"/Contents/Frameworks/*.dylib | grep -E '(/opt/homebrew|/usr/local)/'; then
            exit 1
          fi
          env -u DYLD_LIBRARY_PATH "$app/Contents/MacOS/onon" -v

      - name: Save Go cache
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      DXC_VERSION: v1.9.2609
      DXC_ARCHIVE: dxc_2026_09_29.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-mupdf
            mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-spirv-cross

      # glslang compiles themes' shaders and SPIRV-Cross translates them to
      # HLSL for Direct3D.
      - name: Verify native dependencies
        run: |
          pkg-config --cflags --libs mupdf sdl3
          test -f /ucrt64/include/glslang/Include/glslang_c_interface.h
          test -f /ucrt64/include/spirv_cross/spirv_cross_c.h

      # Direct3D 12 takes a shader as DXIL, which only Microsoft's DirectX
      # Shader Compiler makes; neither Windows nor MSYS2 has it.
      - name: Fetch the DirectX Shader Compiler
        run: |
          curl -fsSL -o dxc.zip "https://github.com/microsoft/DirectXShaderCompiler/releases/download/${DXC_VERSION}/${DXC_ARCHIVE}"
          mkdir -p dxc
          /c/Windows/System32/tar.exe -xf dxc.zip -C dxc bin/x64/dxcompiler.dll LICENSE-LLVM.txt LICENSE-MS.txt
          test -f dxc/bin/x64/dxcompiler.dll
          # Where the tests' binaries find it.
          cp dxc/bin/x64/dxcompiler.dll /ucrt64/bin/

      # Restored everywhere, saved only from main (whose caches pull requests
      # can read) and only when go.sum, Go or the C libraries have changed.
      # Go does not hash the headers cgo reads, so a package built against
      # an older MuPDF would be reused, and MuPDF refuses to start when its
      # header and library versions differ.
      - name: Locate Go cache
        id: go
        run: |
          echo "GOCACHE=${RUNNER_TEMP}/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=${RUNNER_TEMP}/go-mod" >> "$GITHUB_ENV"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
          echo "native=$(pacman -Q mingw-w64-ucrt-x86_64-mupdf mingw-w64-ucrt-x86_64-sdl3 mingw-w64-ucrt-x86_64-glslang mingw-w64-ucrt-x86_64-spirv-cross | tr -s ' \n' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: go-${{ runner.os }}-${{ steps.go.outputs.version }}-${{ steps.go.outputs.native }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ steps.go.outputs.version }}-${{ steps.go.outputs.native }}-

      - name: Test
        run: go test -count=1 ./...

      - name: Build
        run: go build ./...

      - name: Save Go cache
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
