name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  macos:
    name: Build macOS ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goarch: amd64
          - runner: macos-latest
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: brew install sdl3 mupdf glslang spirv-cross go dylibbundler

      # glslang compiles themes' shaders and is bundled with the app;
      # SPIRV-Cross, which translates them for Metal, is linked statically.
      - name: Set up environment
        run: |
          MUPDF_PREFIX="$(brew --prefix mupdf)"
          GLSLANG_PREFIX="$(brew --prefix glslang)"
          SPIRV_CROSS_PREFIX="$(brew --prefix spirv-cross)"
          echo "CGO_CFLAGS=-I${MUPDF_PREFIX}/include -I${GLSLANG_PREFIX}/include -I${SPIRV_CROSS_PREFIX}/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L${MUPDF_PREFIX}/lib -L${GLSLANG_PREFIX}/lib -L${SPIRV_CROSS_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=${MUPDF_PREFIX}/lib:${GLSLANG_PREFIX}/lib:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Verify native dependencies
        run: |
          test -f "$(brew --prefix mupdf)/include/mupdf/fitz.h"
          test -f "$(brew --prefix mupdf)/lib/libmupdf.dylib"
          test -f "$(brew --prefix sdl3)/lib/libSDL3.dylib"
          test -f "$(brew --prefix glslang)/lib/libglslang.dylib"
          test -f "$(brew --prefix spirv-cross)/lib/libspirv-cross-c.a"

      - name: Build
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X onon/internal/config.Version=${VERSION}" -o dist/onon .

      - name: Package
        run: |
          name="onon-${VERSION}-darwin-${{ matrix.goarch }}"
          version="${VERSION#v}"
          app="onon.app"

          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$app/Contents/Frameworks"
          cp dist/onon "$app/Contents/MacOS/onon"

          sed -e "s/@VERSION@/${version}/" -e "s/@BUILD@/${GITHUB_RUN_NUMBER}/" \
            assets/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"

          cp assets/macos/onon.icns "$app/Contents/Resources/onon.icns"
          # macOS 26 and later take the adaptive icon from Assets.car, which
          # assets/icon/build.sh compiles from onon.icon; older macOS uses onon.icns.
          cp assets/macos/Assets.car "$app/Contents/Resources/Assets.car"

          dylibbundler -od -b -x "$app/Contents/MacOS/onon" -d "$app/Contents/Frameworks" -p "@executable_path/../Frameworks"
          cp "$(brew --prefix sdl3)/lib/libSDL3.dylib" "$app/Contents/Frameworks/libSDL3.dylib"
          install_name_tool -id "@executable_path/../Frameworks/libSDL3.dylib" "$app/Contents/Frameworks/libSDL3.dylib"
          codesign --force --sign - "$app/Contents/Frameworks/libSDL3.dylib"
          # SDL is dlopen()ed by bare name, which dyld resolves through the
          # executable's rpaths.
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$app/Contents/MacOS/onon"
          codesign --force --sign - "$app/Contents/MacOS/onon"
          test -f "$app/Contents/Frameworks/libSDL3.dylib"
          if otool -L "$app/Contents/MacOS/onon" "$app"/Contents/Frameworks/*.dylib | grep -E '(/opt/homebrew|/usr/local)/'; then
            exit 1
          fi
          env -u DYLD_LIBRARY_PATH "$app/Contents/MacOS/onon" -v
          codesign --force --deep --sign - "$app"

          mkdir -p "${name}.dmgroot"
          cp -R "$app" "${name}.dmgroot/"
          ln -s /Applications "${name}.dmgroot/Applications"
          hdiutil create -volname "onon" -srcfolder "${name}.dmgroot" -ov -format UDZO "${name}.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onon-${{ github.ref_name }}-darwin-${{ matrix.goarch }}
          path: onon-${{ github.ref_name }}-darwin-${{ matrix.goarch }}.dmg
          if-no-files-found: error

  windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      DXC_VERSION: v1.9.2609
      DXC_ARCHIVE: dxc_2026_09_29.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-mupdf
            mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-spirv-cross

      # glslang compiles themes' shaders and SPIRV-Cross translates them to
      # HLSL for Direct3D.
      - name: Verify native dependencies
        run: |
          pkg-config --cflags --libs mupdf sdl3
          test -f /ucrt64/include/glslang/Include/glslang_c_interface.h
          test -f /ucrt64/include/spirv_cross/spirv_cross_c.h

      # Direct3D 12 takes a shader as DXIL, which only Microsoft's DirectX
      # Shader Compiler makes; neither Windows nor MSYS2 has it.
      - name: Fetch the DirectX Shader Compiler
        run: |
          curl -fsSL -o dxc.zip "https://github.com/microsoft/DirectXShaderCompiler/releases/download/${DXC_VERSION}/${DXC_ARCHIVE}"
          mkdir -p dxc
          /c/Windows/System32/tar.exe -xf dxc.zip -C dxc bin/x64/dxcompiler.dll LICENSE-LLVM.txt LICENSE-MS.txt
          test -f dxc/bin/x64/dxcompiler.dll

      - name: Compile Windows resources
        run: |
          version="${VERSION#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*)
              version_commas="$(printf '%s' "$version" | awk -F. '{ printf "%d,%d,%d,0", $1, $2, $3 }')"
              ;;
            *)
              version="0.0.0"
              version_commas="0,0,0,0"
              ;;
          esac

          cat > onon.rc <<EOF
          #include <winver.h>

          IDI_ICON1 ICON "assets/onon.ico"
          1 RT_MANIFEST "assets/windows/onon.exe.manifest"

          VS_VERSION_INFO VERSIONINFO
          FILEVERSION ${version_commas}
          PRODUCTVERSION ${version_commas}
          FILEFLAGSMASK 0x3fL
          FILEFLAGS 0x0L
          FILEOS 0x40004L
          FILETYPE 0x1L
          FILESUBTYPE 0x0L
          BEGIN
            BLOCK "StringFileInfo"
            BEGIN
              BLOCK "040904b0"
              BEGIN
                VALUE "CompanyName", "onon\\0"
                VALUE "FileDescription", "onon Document Viewer\\0"
                VALUE "FileVersion", "${version}\\0"
                VALUE "InternalName", "onon\\0"
                VALUE "OriginalFilename", "onon.exe\\0"
                VALUE "ProductName", "onon\\0"
                VALUE "ProductVersion", "${version}\\0"
              END
            END
            BLOCK "VarFileInfo"
            BEGIN
              VALUE "Translation", 0x409, 1200
            END
          END
          EOF

          windres -O coff -o rsrc_windows_amd64.syso onon.rc

      - name: Build
        env:
          CGO_ENABLED: 1
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -H=windowsgui -X onon/internal/config.Version=${VERSION}" -o dist/onon.exe .

      - name: Package
        run: |
          name="onon-${VERSION}-windows-amd64"
          mkdir -p "$name"
          cp dist/onon.exe "$name/"
          ldd dist/onon.exe \
            | awk '/\/ucrt64\/bin\// { print $3 }' \
            | sort -u \
            | xargs -r cp -t "$name/"
          cp /ucrt64/bin/SDL3.dll "$name/"
          # Loaded when a theme's shader is first compiled, with its licences.
          cp dxc/bin/x64/dxcompiler.dll "$name/"
          mkdir -p "$name/licenses/dxc"
          cp dxc/LICENSE-LLVM.txt dxc/LICENSE-MS.txt "$name/licenses/dxc/"
          rm -rf dist/onon-package
          cp -R "$name" dist/onon-package
          powershell -NoProfile -Command "\$env:PATH='${PWD}/${name};C:/msys64/ucrt64/bin;C:/msys64/usr/bin;' + \$env:PATH; \$p = Start-Process -FilePath '${PWD}/${name}/onon.exe' -ArgumentList '-v' -Wait -PassThru; exit \$p.ExitCode"
          powershell -NoProfile -Command "Compress-Archive -Path '${name}' -DestinationPath '${name}.zip'"

      - name: Build installer
        shell: pwsh
        env:
          ONON_VERSION: ${{ github.ref_name }}
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" assets\windows\onon.iss

      - name: Collect Windows release files
        shell: pwsh
        run: |
          Copy-Item `
            "dist/installer/onon-${{ github.ref_name }}-windows-amd64-installer.exe" `
            "onon-${{ github.ref_name }}-windows-amd64-installer.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onon-${{ github.ref_name }}-windows-amd64
          path: |
            onon-${{ github.ref_name }}-windows-amd64.zip
            onon-${{ github.ref_name }}-windows-amd64-installer.exe
          if-no-files-found: error

  linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    # The oldest Ubuntu LTS still supported sets the glibc the packages need,
    # so they run there and on anything newer. Its MuPDF is too old and it has
    # no SDL3, so both are built from source, as is glslang, which compiles
    # themes' shaders; Vulkan takes what it makes, so Linux needs no
    # SPIRV-Cross.
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      MUPDF_VERSION: 1.28.5
      SDL3_VERSION: 3.4.18
      GLSLANG_VERSION: 16.6.0
      NFPM_VERSION: v2.48.0
    steps:
      - name: Install native dependencies
        # SDL loads X11, Wayland and the rest when it starts, so it needs only
        # their headers to build.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl desktop-file-utils file git pkg-config \
            libgtk-3-dev \
            libdbus-1-dev libdecor-0-dev libdrm-dev libegl1-mesa-dev libgbm-dev libgl1-mesa-dev \
            libgles2-mesa-dev libibus-1.0-dev libudev-dev libwayland-dev libx11-dev libxcursor-dev \
            libxext-dev libxfixes-dev libxi-dev libxkbcommon-dev libxrandr-dev libxss-dev libxtst-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # A tag's cache can only be read by that same tag, so saving one
          # costs time and quota for nothing.
          cache: false

      - name: Build MuPDF
        # Linked statically, so the packages need no MuPDF from the system,
        # whose version differs between distributions.
        run: |
          curl -fsSL "https://mupdf.com/downloads/archive/mupdf-${MUPDF_VERSION}-source.tar.gz" | tar -xz
          make -C "mupdf-${MUPDF_VERSION}-source" -j"$(nproc)" build=release \
            HAVE_X11=no HAVE_GLUT=no HAVE_LIBCRYPTO=no XCFLAGS=-fPIC \
            prefix=/opt/mupdf install-libs
          mkdir -p /opt/mupdf/lib/pkgconfig
          cat > /opt/mupdf/lib/pkgconfig/mupdf.pc <<EOF
          Name: mupdf
          Description: MuPDF
          Version: ${MUPDF_VERSION}
          Cflags: -I/opt/mupdf/include
          Libs: -L/opt/mupdf/lib -lmupdf -lmupdf-third -lm -lpthread
          EOF

      - name: Build glslang
        # Linked statically, as MuPDF is, and without its optimiser, which
        # would need SPIRV-Tools.
        run: |
          curl -fsSL "https://github.com/KhronosGroup/glslang/archive/refs/tags/${GLSLANG_VERSION}.tar.gz" | tar -xz
          cmake -S "glslang-${GLSLANG_VERSION}" -B glslang-build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DENABLE_OPT=OFF \
            -DENABLE_GLSLANG_BINARIES=OFF -DGLSLANG_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/opt/glslang
          cmake --build glslang-build -j"$(nproc)"
          cmake --install glslang-build

      - name: Build SDL3
        run: |
          curl -fsSL "https://github.com/libsdl-org/SDL/releases/download/release-${SDL3_VERSION}/SDL3-${SDL3_VERSION}.tar.gz" | tar -xz
          cmake -S "SDL3-${SDL3_VERSION}" -B sdl3-build -DCMAKE_BUILD_TYPE=Release -DSDL_STATIC=OFF -DSDL_TESTS=OFF
          cmake --build sdl3-build -j"$(nproc)"

      - name: Build
        env:
          CGO_ENABLED: 1
          PKG_CONFIG_PATH: /opt/mupdf/lib/pkgconfig
          CGO_CFLAGS: -I/opt/glslang/include
          CGO_LDFLAGS: -L/opt/glslang/lib
        # onon dlopen()s libSDL3.so.0 by bare name, which the rpath resolves to
        # the copy installed beside it in lib/onon.
        run: |
          # The container's root does not own the checkout, which git refuses
          # to read for go build's VCS stamp otherwise.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pkg-config --cflags --libs mupdf
          mkdir -p dist/linux/bin
          go build -trimpath -ldflags "-s -w -X onon/internal/config.Version=${VERSION} -extldflags=-Wl,-rpath,\$ORIGIN/../lib/onon" -o dist/linux/bin/onon .

      - name: Stage
        # dist/linux is laid out as under /usr, for the packages and tarball.
        run: |
          stage=dist/linux
          install -Dm644 sdl3-build/libSDL3.so.0 "$stage/lib/onon/libSDL3.so.0"
          install -Dm644 onon.desktop "$stage/share/applications/onon.desktop"
          install -Dm644 assets/onon.svg "$stage/share/icons/hicolor/scalable/apps/onon.svg"
          install -Dm644 assets/onon.png "$stage/share/icons/hicolor/256x256/apps/onon.png"
          install -Dm644 LICENSE "$stage/share/licenses/onon/LICENSE"

          # SDL is found through the rpath alone, and MuPDF and glslang are
          # linked in.
          "$stage/bin/onon" -v
          if ldd "$stage/bin/onon" | grep -E 'mupdf|glslang|SPIRV|not found'; then
            exit 1
          fi

          # The packages require the newest glibc version either file uses.
          glibc="$(objdump -T "$stage/bin/onon" "$stage/lib/onon/libSDL3.so.0" | grep -o 'GLIBC_[0-9.]*' | cut -d_ -f2 | sort -uV | tail -n1)"
          echo "Requires glibc ${glibc}"
          echo "ONON_GLIBC=${glibc}" >> "$GITHUB_ENV"

      - name: Package deb, rpm and tarball
        run: |
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) export ONON_PACKAGE_VERSION="$VERSION" ;;
            *) export ONON_PACKAGE_VERSION=0.0.0 ;;
          esac
          name="onon-${VERSION}-linux-x86_64"
          # The released binary, rather than compiling nfpm with go run.
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${NFPM_VERSION#v}_Linux_x86_64.tar.gz" | tar -xz nfpm
          for packager in deb rpm; do
            ./nfpm package \
              --config assets/linux/nfpm.yaml --packager "$packager" --target "${name}.${packager}"
          done
          cp -R dist/linux "$name"
          tar -czf "${name}.tar.gz" "$name"

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
          NO_STRIP: 1
          LDAI_OUTPUT: onon-${{ github.ref_name }}-linux-x86_64.AppImage
        run: |
          mkdir -p AppDir/usr
          cp -R dist/linux/bin dist/linux/share AppDir/usr/
          # appimagetool makes .DirIcon from a PNG named after the desktop
          # file's Icon= at the top of the AppDir; it does not take the SVG.
          cp dist/linux/share/icons/hicolor/256x256/apps/onon.png AppDir/onon.png

          curl -fsSL -o linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          # linuxdeploy points the binary's rpath at usr/lib, so SDL goes there.
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/onon.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/onon.svg \
            --executable AppDir/usr/bin/onon \
            --library dist/linux/lib/onon/libSDL3.so.0 \
            --output appimage
          "./${LDAI_OUTPUT}" -v

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onon-${{ github.ref_name }}-linux-x86_64
          path: |
            onon-${{ github.ref_name }}-linux-x86_64.AppImage
            onon-${{ github.ref_name }}-linux-x86_64.deb
            onon-${{ github.ref_name }}-linux-x86_64.rpm
            onon-${{ github.ref_name }}-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - macos
      - windows
      - linux
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" dist/onon-* --title "$VERSION" --generate-notes

